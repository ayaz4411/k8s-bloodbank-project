apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: myapp

spec:
  serviceName: mysqldb
  replicas: 3

  selector:
    matchLabels:
      app: app-database

  template:
    metadata:
      labels:
        app: app-database

    spec:
      containers:
        - name: cont-1
          image: ayaz4411/bapp:db

          ports:
            - containerPort: 3306

          envFrom:
            - secretRef:
                name: dapp-secret

          resources:
            requests:
              cpu: "100m"
              memory: "250Mi"
            limits:
              cpu: "100m"
              memory: "700Mi"

          volumeMounts:
            - name: pvc-1
              mountPath: /usr/share/nginx/html

  volumeClaimTemplates:
    - metadata:
        name: pvc-1
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp2
        resources:
          requests:
            storage: 2Gi
